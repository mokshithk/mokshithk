name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *" # Runs every day at 05:17 UTC
  workflow_dispatch:      # Allows you to trigger it manually anytime

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stats generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit changes only if modified
        run: |
          FILES="stats.svg streak.svg year.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push